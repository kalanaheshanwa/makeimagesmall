name: Daily SEO Blog Post

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate today's blog post
        run: node scripts/generate-post.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit and push new post
        run: |
          git config user.name "MakeImageSmall Blog Bot"
          git config user.email "bot@makeimagesmall.com"
          git add blog/
          git diff --staged --quiet || git commit -m "Auto blog post: $(date +%Y-%m-%d)"
          git push
