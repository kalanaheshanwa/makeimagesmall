*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--brand:#2563eb;--brand-h:#1d4ed8;--brand-light:#eff6ff;--brand-mid:#dbeafe;--green:#16a34a;--green-light:#f0fdf4;--green-mid:#dcfce7;--bg:#f8fafc;--white:#ffffff;--surface:#f1f5f9;--text:#0f172a;--sub:#64748b;--muted:#94a3b8;--border:#e2e8f0;--border-strong:#cbd5e1;--shadow:0 1px 3px rgba(0,0,0,.07);--r:14px;--rs:9px}
[data-theme="dark"]{--brand:#4f8ef7;--brand-h:#6ba3f8;--brand-light:rgba(79,142,247,.1);--brand-mid:rgba(79,142,247,.18);--green:#34d468;--green-light:rgba(52,212,104,.08);--green-mid:rgba(52,212,104,.18);--bg:#0a0a0a;--white:#161616;--surface:#111111;--text:#ededed;--sub:#a0a0a0;--muted:#555555;--border:#272727;--border-strong:#333333;--shadow:0 1px 4px rgba(0,0,0,.5)}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;transition:background .3s,color .3s}
header{background:var(--white);border-bottom:1px solid var(--border);padding:12px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);transition:background .3s,border-color .3s}
.logo{display:flex;align-items:center;text-decoration:none;line-height:1}
.logo-svg{height:44px;width:auto;flex-shrink:0}
.logo-light{display:block}
.logo-dark{display:none}
[data-theme="dark"] .logo-light{display:none}
[data-theme="dark"] .logo-dark{display:block}
.header-right{display:flex;align-items:center;gap:12px}
.nav-link{font-size:13px;color:var(--sub);text-decoration:none;font-weight:500;padding:5px 10px;border-radius:6px;transition:color .15s,background .15s}
.nav-link:hover{color:var(--text);background:var(--surface)}
.toggle-wrap{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub)}
.toggle-icon{font-size:14px;line-height:1;cursor:default}
.dark-toggle{width:38px;height:22px;border-radius:11px;background:var(--border-strong);border:none;cursor:pointer;position:relative;transition:background .3s;flex-shrink:0}
.dark-toggle::after{content:'';width:16px;height:16px;background:white;border-radius:50%;position:absolute;top:3px;left:3px;transition:left .25s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
[data-theme="dark"] .dark-toggle{background:var(--brand)}
[data-theme="dark"] .dark-toggle::after{left:19px}
main{max-width:960px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.page-sub{font-size:15px;color:var(--sub);margin-bottom:32px}
.blog-grid{display:grid;gap:12px}
.blog-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;text-decoration:none;color:var(--text);display:block;transition:border-color .15s,box-shadow .15s;box-shadow:var(--shadow)}
.blog-card:hover{border-color:var(--brand);box-shadow:0 4px 12px rgba(37,99,235,.1)}
.blog-card-title{font-size:16px;font-weight:500;margin-bottom:6px;line-height:1.4}
.blog-card-excerpt{font-size:13px;color:var(--sub);margin-bottom:10px;line-height:1.5}
.blog-card-footer{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#9ca3af}
.blog-tags{display:flex;gap:5px;flex-wrap:wrap}
.blog-tag{font-size:10px;padding:2px 7px;border-radius:100px;background:var(--brand-light);color:var(--brand);font-weight:500}
.ad-slot{background:var(--white);border:1px solid var(--border);border-radius:var(--rs);padding:12px;text-align:center;color:#d1d5db;font-size:12px;margin:24px 0;min-height:100px;display:flex;align-items:center;justify-content:center}
.empty{text-align:center;padding:60px 20px;color:var(--sub)}
#loading{text-align:center;padding:40px;color:var(--sub);font-size:14px}
footer{border-top:1px solid var(--border);background:var(--white);padding:18px 24px;text-align:center;font-size:12px;color:var(--sub)}
footer a{color:var(--sub);text-decoration:none;margin:0 8px}

<script>
fetch('/blog/posts.json?v='+Date.now())
  .then(r=>r.json())
  .then(posts=>{
    document.getElementById('loading').style.display='none';
    const grid=document.getElementById('blogGrid');
    grid.style.display='grid';
    const sorted=[...posts].reverse();
    if(!sorted.length){grid.innerHTML='<div class="empty">No posts yet — check back soon.</div>';return}
    grid.innerHTML=sorted.map(p=>`
      <a href="/blog/${p.slug}.html" class="blog-card">
        <div class="blog-card-title">${p.title}</div>
        <div class="blog-card-excerpt">${p.excerpt||''}</div>
        <div class="blog-card-footer">
          <div class="blog-tags">${(p.tags||[]).slice(0,3).map(t=>`<span class="blog-tag">${t}</span>`).join('')}</div>
          <span>${p.date}</span>
        </div>
      </a>`).join('');
  })
  .catch(()=>{
    document.getElementById('loading').textContent='No articles yet.';
  });
</script>
<script>
function toggleDark(){
  const html=document.documentElement;
  const isDark=html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme',isDark?'light':'dark');
  document.getElementById('themeIcon').textContent=isDark?'🌙':'☀️';
  localStorage.setItem('mis-theme',isDark?'light':'dark');
}
(function(){
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const icon=document.getElementById('themeIcon');
  if(icon)icon.textContent=isDark?'☀️':'🌙';
})();
</script>
